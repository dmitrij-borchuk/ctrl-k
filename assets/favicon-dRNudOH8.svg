<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Outer Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Keycap Bevel / Face Gradient -->
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Letter K Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Outer Soft Glow / Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3b82f6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Keycap Base with Glow -->
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2" filter="url(#glow)" />

  <!-- Keycap Face (Inner 3D Bevel) -->
  <rect x="9" y="8" width="46" height="44" rx="10" fill="url(#keyTop)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Letter 'K' Symbol -->
  <path d="M 23 20 L 23 44 M 41 20 L 25 32 L 41 44" stroke="url(#glyphGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
